name: Build and test with pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:

      - name: Log reason (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Reason for triggering: ${{ github.event.inputs.reason }}"

      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f dev-requirements.txt ]; then pip install -r dev-requirements.txt; fi

      - name: Install
        run: python -m pip install -e .

      - name: Lint
        run: ruff check navicat_mikimo/__main__.py navicat_mikimo/screen_reaction_condition.py tests

      - name: Test with pytest
        run: pytest
