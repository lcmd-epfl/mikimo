[build-system]
requires = ["setuptools", "wheel", "cython>=0.29.22", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "navicat_mikimo"
version = "2.0.1"
authors = [
  { name = "pregabalin_Hoshiyomi", email = "thanapat.worakul@epfl.ch" },
]
description = "microkinetic modeling code for homogeneous catalytic reactions"
keywords = ["computational chemistry utility"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Cython>=3.0.0",
    "numpy>=1.24.1",
    "scipy>=1.10.0",
    "autograd>=1.5",
    "matplotlib>=3.6.3",
    "pandas>=1.5.3",
    "h5py>=3.8.0",
    "fire>=0.5.0",
    "setuptools>=67.1.0",
    "navicat-volcanic>=1.2.12",
    "openpyxl>=3.1.2",
    "tqdm>=4.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
navicat_mikimo = "navicat_mikimo.__main__:main"
navicat_mikimo_hydra = "navicat_mikimo.hydra_main:main"
navicat_mikimo_config = "navicat_mikimo.config_runner:main"

[project.optional-dependencies]
hydra = [
    "hydra-core>=1.3,<1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["navicat_mikimo/kinetic_solver.c"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["navicat_mikimo/kinetic_solver.c"]
